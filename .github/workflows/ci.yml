# Checks every push and pull request: the app (types, tests, build), the Cloudflare connector
# (types, a dry-run deploy) and the Rust worker (build, tests). GPU rendering isn't tested here:
# GitHub's runners have no GPU.
#
# Pushes to main then deploy the app and connector to Cloudflare, once every check has passed.
# That step needs two repository secrets (Settings → Secrets and variables → Actions):
# CLOUDFLARE_API_TOKEN (a token with "Edit Cloudflare Workers" permissions) and
# CLOUDFLARE_ACCOUNT_ID. Without them it's skipped.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (Svelte, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Bundle the coordinator, worker and headless renderer
        run: |
          for t in coordinator worker render-headless inspect-vox; do
            npx esbuild --bundle --platform=node --format=esm --packages=external --log-level=warning tools/$t.ts --outfile=.build/$t.mjs
          done

  cloud:
    name: Cloudflare connector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - name: Build the app (the Worker serves it)
        working-directory: .
        run: npm ci && npx vite build
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx wrangler deploy --dry-run --outdir /tmp/worker

  rust:
    name: Rust worker (prism)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --release --locked
      - run: cargo test --release --locked

  deploy:
    name: Deploy to Cloudflare
    needs: [app, cloud, rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy on every push to main."
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - name: Build the app
        if: steps.creds.outputs.skip != 'true'
        run: npm ci && npx vite build
      - name: Deploy
        if: steps.creds.outputs.skip != 'true'
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm ci && npm run deploy
